# 定时刷新插件索引：每天 01:00（系统时区 Asia/Shanghai）拉取最新版本与 Git 提交。
# 只有 index.json 真的变化才会产生一次提交；回推会顺带触发 main 的 push 流水线（同步到 GitHub）。
# 修改本文件后必须同时改动 .cnb.yml（哪怕只加一个空行），否则平台不会重新解析 include 模板。
main:
  'crontab: 0 1 * * *':
    - name: refresh-plugin-index
      docker:
        image: node:22
      stages:
        - name: regenerate index
          script: |
            set -e
            npm ci
            npm run index
        - name: commit and push
          script: |
            set -e
            if git diff --quiet -- index.json; then
              echo "index.json 无变化，跳过提交"
              exit 0
            fi
            git config user.name "cnb-bot"
            git config user.email "cnb-bot@users.noreply.github.com"
            git add index.json
            git commit -m "chore(index): 每日定时刷新索引"
            git push origin HEAD:main
