# 索引配置：
#   market    — 写进 index.json 的根字段（title 必填）
#   sources   — 收录哪些插件，顺序即「发现」页默认顺序
#   overrides — 单个插件的展示字段与收录策略
# 以 @ 开头的包名必须加引号，否则不是合法 YAML。

market:
  title:
    en: smkit plugin index
    zh: smkit 插件索引
  description:
    en: Plugins maintained by smk-h for DeepSeek Harness.
    zh: smk-h 维护的 DeepSeek Harness 插件。

sources:
  npm:
    - '@smai-kit/dsh-smkit'
    - dsh-better-sidebar
    - dsh-sessions-manager
    - dsh-context
  github:
    - csyangwen/dsh-memory-evolve

overrides:
  '@smai-kit/dsh-smkit':
    title: dsh-smkit
    description:
      en: 'MCP manager for DeepSeek Harness: per-workspace MCP servers, an opt-in on-demand tool broker, OAuth, plus skills, OpenSpec, session deletion, theme center and more.'
      zh: DeepSeek Harness 的 MCP 管理器：按工作区启停 MCP、按需工具代理、OAuth，另含技能、OpenSpec、删除会话、主题中心等十三项功能。
  dsh-better-sidebar:
    title: Better Sidebar
    icon: icons/dsh-better-sidebar.svg
  dsh-memory-evolve:
    title: Memory Evolve
    allowPrivate: true
  dsh-sessions-manager:
    title: Sessions Manager
  dsh-context:
    title: Context
    icon: icons/dsh-context.svg
